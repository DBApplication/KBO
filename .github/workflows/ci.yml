name: CI

# PR 은 모든 브랜치에서, push 는 main 에서만 실행한다.
# - PR 브랜치에 푸시하면 pull_request 만 돌아 같은 커밋이 중복 실행되지 않는다.
# - pull_request 는 head 를 base 에 머지한 결과를 빌드하므로,
#   내 브랜치만으로는 통과하지만 main 과 합치면 깨지는 경우를 잡는다.
on:
  pull_request:
  push:
    branches: [main]

# 코드를 읽기만 하면 되므로 최소 권한으로 제한한다.
permissions:
  contents: read

# 같은 PR·브랜치에 새 커밋이 올라오면 진행 중이던 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Backend 빌드 · 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 테스트가 Testcontainers 로 PostgreSQL 을 직접 띄우므로 services: postgres 블록은 두지 않는다.
      # (ubuntu-latest 러너에는 Docker 가 설치돼 있다)
      # Flyway 마이그레이션 적용 후 ddl-auto=validate 로 엔티티와 스키마가 맞는지까지 검증된다.
      - name: 빌드 · 테스트
        run: ./gradlew build

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          # working-directory 와 무관하게 워크스페이스 루트 기준 경로를 쓴다.
          path: backend/build/reports/tests/test
          retention-days: 7
