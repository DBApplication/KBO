name: PR Title

# Squash merge 를 쓰므로 PR 제목이 그대로 main 의 커밋 메시지가 된다.
# 따라서 커밋 컨벤션 검사는 PR 제목에 건다.
on:
  pull_request:
    # synchronize 를 포함해야 커밋을 푸시할 때마다 재실행된다. 이게 없으면
    # 워크플로 추가 이전에 열려 있던 PR 에서는 검사가 한 번도 돌지 않는다.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-commits:
    name: 제목 컨벤션 검사
    runs-on: ubuntu-latest

    steps:
      - name: Conventional Commits 형식 확인
        env:
          # 제목을 run 스크립트에 직접 보간하면 커맨드 인젝션이 되므로 환경변수로 넘긴다.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # 패턴은 반드시 변수에 담아서 쓴다. [[ =~ ]] 에 직접 적으면 \( 이스케이프가
          # 셸에 먹혀 literal 괄호가 아니라 그룹으로 해석되고, "feature: ..." 같은
          # 잘못된 제목이 통과해 버린다.
          PATTERN='^(feat|fix|refactor|docs|test|chore|ci)(\([a-z0-9,/-]+\))?: .+'
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "::error::PR 제목이 커밋 컨벤션에 맞지 않습니다 → $TITLE"
            echo "형식: type(scope): 설명   (scope 는 생략 가능)"
            echo "type: feat | fix | refactor | docs | test | chore | ci"
            echo "예시: feat(player): 선수 검색 API 추가"
            exit 1
          fi
          echo "통과: $TITLE"
