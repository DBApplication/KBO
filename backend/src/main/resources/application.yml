spring:
  application:
    name: kbo
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:kbo}
    username: ${DB_USERNAME:kbo}
    password: ${DB_PASSWORD:kbo}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # jdbc.time_zone(Asia/Seoul) 을 두면 서버 JVM 이 UTC 일 때 TIME 칼럼(match_time)이
        # 9시간 밀려서 나온다 (DB 14:00 → API 05:00). 시간대 없는 DATE/TIME 만 쓰므로 변환하지 않는다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
