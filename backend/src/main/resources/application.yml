spring:
  application:
    name: kbo
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:kbo}
    username: ${DB_USERNAME:kbo}
    password: ${DB_PASSWORD:kbo}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # jdbc.time_zone(Asia/Seoul) 을 두면 서버 JVM 이 UTC 일 때 TIME 칼럼(match_time)이
        # 9시간 밀려서 나온다 (DB 14:00 → API 05:00). 시간대 없는 DATE/TIME 만 쓰므로 변환하지 않는다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  # KBO 경기 데이터 자동 수집 (domain/collect). 매일 예약 실행은 기본으로 꺼 두고 운영(prod)에서 켠다.
  # 관리자 수동 수집 API(POST /api/admin/kbo-sync)는 KBO_SYNC_ADMIN_TOKEN 이 설정돼 있을 때만 열린다.
  kbo-sync:
    enabled: ${KBO_SYNC_ENABLED:false}
    cron: ${KBO_SYNC_CRON:0 30 4 * * *}
    lookback-days: 2
    upcoming-days: 7
    live-enabled: ${KBO_SYNC_LIVE_ENABLED:false}   # 경기 시간대 실시간 갱신
    live-cron: ${KBO_SYNC_LIVE_CRON:0 */5 13-23 * * *}
    admin-token: ${KBO_SYNC_ADMIN_TOKEN:}
